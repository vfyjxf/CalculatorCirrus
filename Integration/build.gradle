plugins {
    id 'net.neoforged.moddev'
    id 'maven-publish'
    id 'io.freefair.lombok' version '8.7.1'
}

neoForge {
    version = project.neo_version
}

repositories {
    mavenCentral()
    maven { url = "https://maven.firstdarkdev.xyz/snapshots" } // LDLib
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven { // Registrate
        url "https://maven.tterrag.com/"
    }
}

configurations{
    runtimeClasspath.extendsFrom localRuntime
}

def base = project(":Mod")

dependencies {
    compileOnly(base)
    localRuntime(base)
//    implementation("maven.modrinth:gregtechceu-modern:mc1.21.1-1.4.6:slim")
    implementation("com.gregtechceu.gtceu:gtceu-${project.minecraft_version}:${gtm_version}") { transitive = false }
    implementation("org.eclipse.collections:eclipse-collections-api:11.1.0")
    implementation("org.eclipse.collections:eclipse-collections:11.1.0")
    testImplementation(base)
}

lombok {
    version = "1.18.32"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : base.minecraft_version,
            minecraft_version_range: base.minecraft_version_range,
            neo_version            : base.neo_version,
            neo_version_range      : base.neo_version_range,
            loader_version_range   : base.loader_version_range,
            mod_license            : base.mod_license,
            mod_version            : base.mod_version,
            mod_authors            : base.mod_authors,
            mod_description        : base.mod_description,
            jei_version            : base.jei_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata