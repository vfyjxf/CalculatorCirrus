plugins {
    id 'net.neoforged.moddev'
    id 'maven-publish'
    id 'io.freefair.lombok' version '8.7.1'
}

neoForge {
    version = project.neo_version

    mods {
        "cirrus_integration" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods.cirrus_integration
    }
}

repositories {
    mavenCentral()
    maven { url = "https://maven.firstdarkdev.xyz/snapshots" } // LDLib
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven { // Registrate
        url "https://maven.tterrag.com/"
    }
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly("dev.vfyjxf:cloudlib")
    compileOnly(project(":Mod"))
    localRuntime(project(":Mod"))
//    compileOnly("dev.vfyjxf:cloudlib")
//    implementation("maven.modrinth:gregtechceu-modern:mc1.21.1-1.4.6:slim")
//    implementation("aztech:Modern-Industrialization:2.3.11")
    implementation("com.gregtechceu.gtceu:gtceu-${}:${gtm_version}") { transitive = false }
    implementation("org.eclipse.collections:eclipse-collections-api:11.1.0")
    implementation("org.eclipse.collections:eclipse-collections:11.1.0")

    compileOnly 'com.google.auto.service:auto-service:1.1.1'
    annotationProcessor 'com.google.auto.service:auto-service:1.1.1'

    testImplementation(project(":Mod"))
}

test {
    useJUnitPlatform()
}

lombok {
    version = "1.18.32"
}


var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    def base = project(":Mod")
    var replaceProperties = [
            minecraft_version      : base.minecraft_version,
            minecraft_version_range: base.minecraft_version_range,
            neo_version            : base.neo_version,
            neo_version_range      : base.neo_version_range,
            loader_version_range   : base.loader_version_range,
            mod_license            : base.mod_license,
            mod_version            : base.mod_version,
            mod_authors            : base.mod_authors,
            mod_description        : base.mod_description,
            jei_version            : base.jei_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata