// Writes the main runtime classpath to build/chainexport/cp.txt so chain-export.sh can
// spawn bare JVMs (per-pack parallel workers) without gradle overhead.
def chainExportRuntimeClasspath = sourceSets.main.runtimeClasspath
tasks.register('chainExportClasspath') {
    group = 'verification'
    // Without this the classpath resolves to stale build outputs: classes/resources edited
    // in src/main never reached the bare JVMs until something else rebuilt them.
    dependsOn 'classes'
    def output = layout.buildDirectory.file('chainexport/cp.txt')
    // No declared outputs: the classpath string is not a task input, so always rewrite it.
    doLast {
        def file = output.get().asFile
        file.parentFile.mkdirs()
        file.text = chainExportRuntimeClasspath.asPath
        println "chain-export classpath written to ${file}"
    }
}

// Offline plan bench over exports/<pack>/recipes-*.json (or an exports.zip): loads the raw
// catalog, compiles the L1 graph and plans the requested targets without launching the game.
//   ./gradlew :Mod:chainExport -PcirrusChainsPacks=fom -PcirrusChainsOut=../chain-exports
//   ./gradlew :Mod:chainExport -PcirrusChainsZip=../exports.zip -PcirrusChainsTargets=minecraft:hopper=1
// chain-export.sh wraps this with parallel per-pack workers.
tasks.register('chainExport', JavaExec) {
    group = 'verification'
    description = 'Runs the offline plan bench over exported pack dumps (no game launch).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.vfyjxf.cirrus.planning.offline.OfflinePlanBench'
    workingDir = rootProject.projectDir
    jvmArgs '-Xmx8g'
    def outDir = (findProperty('cirrusChainsOut') ?: '../chain-exports').toString()
    def zip = (findProperty('cirrusChainsZip') ?: '').toString().trim()
    def argsList = zip.isEmpty()
            ? ['--export-dir', (findProperty('cirrusChainsExportDir') ?: '../exports').toString(), '--out', outDir]
            : ['--zip', zip, '--out', outDir]
    def packs = (findProperty('cirrusChainsPacks') ?: '').toString().trim()
    if (!packs.isEmpty()) {
        argsList.addAll(['--packs', packs])
    }
    def targets = (findProperty('cirrusChainsTargets') ?: '').toString().trim()
    if (!targets.isEmpty()) {
        argsList.addAll(['--targets', targets])
    }
    def perPack = (findProperty('cirrusChainsPerPack') ?: '').toString().trim()
    if (!perPack.isEmpty()) {
        argsList.addAll(['--per-pack', perPack])
    }
    args argsList
}

tasks.named('jmhJar', Jar).configure {
    zip64 = true
    // The fat jmh jar merges log4j's multi-release classes; without this attribute
    // log4j-api falls back to its Java-8 StackLocator and caller detection fails on JDK 21.
    manifest {
        attributes 'Multi-Release': 'true'
    }
}

// Property-driven JMH runner that keeps the default jmh task untouched:
//   ./gradlew :Mod:jmhRun -PcirrusJmhInclude=<benchmark regex> -PcirrusJmhResult=<json path>
//   [-PcirrusJmhExtra="-f 1 -wi 0 -i 1 -r 1s -w 1s"]
// cirrusJmhInclude is passed as the positional JMH regex; cirrusJmhResult becomes
// '-rf json -rff <path>' (relative paths resolve against the repo root); cirrusJmhExtra
// is split on whitespace and appended so fork/warmup/measurement annotations can be
// overridden. perf/run-bench.sh wraps this with a score summary.
tasks.register('jmhRun', JavaExec) {
    group = 'verification'
    description = 'Runs the JMH benchmarks matching -PcirrusJmhInclude=<regex>, writing JSON to -PcirrusJmhResult=<path>.'
    def jmhJarTask = tasks.named('jmhJar', Jar)
    dependsOn jmhJarTask
    classpath = files(jmhJarTask.flatMap { it.archiveFile })
    mainClass = 'org.openjdk.jmh.Main'
    jvmArgs '-Xms4g', '-Xmx4g'

    def include = (findProperty('cirrusJmhInclude') ?: '').toString().trim()
    if (include.isEmpty()) {
        throw new GradleException("jmhRun requires -PcirrusJmhInclude=<benchmark regex>, e.g. -PcirrusJmhInclude=RecipeGraphBuildBenchmark")
    }
    def result = (findProperty('cirrusJmhResult') ?: '').toString().trim()
    if (result.isEmpty()) {
        throw new GradleException("jmhRun requires -PcirrusJmhResult=<result json path>, e.g. -PcirrusJmhResult=perf/results/base.json")
    }
    def resultFile = rootProject.file(result)
    resultFile.parentFile.mkdirs()
    args include
    args '-rf', 'json', '-rff', resultFile.absolutePath
    def extra = (findProperty('cirrusJmhExtra') ?: '').toString().trim()
    if (!extra.isEmpty()) {
        args(extra.split(/\s+/) as List)
    }
}