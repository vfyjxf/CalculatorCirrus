// run/mod 隔离：harness run 只加载 engine + 场景 mod；普通 run 不加载 harness 模组，gameDirectory 也不得是 harness 暂存目录。
def harnessRuns = ['clientTests': 'stageClientTestsUiTestMod']
def harnessRunMods = harnessRuns.keySet().collectEntries { name ->
    [(name): neoForge.runs.named(name).map { run -> run.loadedMods.get()*.name.sort().join(',') }]
}
def plainRunNames = neoForge.runs.collect { it.name }.findAll { !harnessRuns.containsKey(it) }.sort()
def plainRunMods = plainRunNames.collectEntries { name ->
    [(name): neoForge.runs.named(name).map { run -> run.loadedMods.get()*.name.sort().join(',') }]
}
def harnessStagingDirs = project.ext.cloudlibUiTestStagedDirs
if (harnessStagingDirs == null) {
    throw new GradleException('gradle/cloudlib-uitest.gradle must run before the isolation gates: it records which run directories stage the cloudlibuitest harness mod')
}
if (!harnessStagingDirs.keySet().containsAll(['runs/client-tests'])) {
    throw new GradleException('every harness run must have a staging directory, found: ' + harnessStagingDirs.keySet())
}
harnessStagingDirs.each { runDirName, stageTaskName ->
    if (tasks.findByName(stageTaskName) == null) {
        throw new GradleException(runDirName + ' names the staging task ' + stageTaskName + ', which does not exist')
    }
}
def plainRunDirs = plainRunNames.collectEntries { name ->
    [(name): neoForge.runs.named(name).map { run -> run.gameDirectory.get().asFile.absolutePath }]
}
def harnessStagingAbsoluteDirs = harnessStagingDirs.keySet().collect { new File(projectDir, it).absolutePath }
def expectedHarnessMods = [project.mod_id.toString(), 'calculatorcirrusuitest'].sort().join(',')
def unitTestLoadedMods = neoForge.unitTest.loadedMods.map { mods -> mods*.name.sort().join(',') }
tasks.register('verifyRunIsolation') {
    group = 'verification'
    description = 'Verifies the harness run loads only the engine and the scenario mod, and that no plain run or the unit-test executor loads the harness mod or stages the harness jar.'
    inputs.property('harnessStagingDirs', harnessStagingDirs.collect { dir, task -> dir + '=' + task }.sort().join(','))
    inputs.property('harnessStagingAbsoluteDirs', harnessStagingAbsoluteDirs.sort().join(','))
    harnessRunMods.each { name, provider -> inputs.property('harnessRunMods.' + name, provider) }
    plainRunMods.each { name, provider -> inputs.property('plainRunMods.' + name, provider) }
    plainRunDirs.each { name, provider -> inputs.property('plainRunDir.' + name, provider) }
    inputs.property('unitTestLoadedMods', unitTestLoadedMods)
    doLast {
        harnessRuns.each { runName, stageTaskName ->
            def declared = harnessRunMods[runName].get()
            if (declared != expectedHarnessMods) {
                throw new GradleException('the ' + runName + ' harness run must load the engine and the scenario composition (' + expectedHarnessMods + '), found: ' + declared)
            }
        }
        plainRunMods.each { name, provider ->
            def loaded = provider.get()
            if (loaded.tokenize(',').contains('calculatorcirrusuitest')) {
                throw new GradleException('the ' + name + ' plain run must not load the calculatorcirrusuitest harness mod, found: [' + loaded + ']')
            }
        }
        def unitTestMods = unitTestLoadedMods.get()
        if (unitTestMods.tokenize(',').contains('calculatorcirrusuitest')) {
            throw new GradleException('the unit-test executor must not load the calculatorcirrusuitest harness mod, found: [' + unitTestMods + ']')
        }
        plainRunDirs.each { name, provider ->
            if (harnessStagingAbsoluteDirs.contains(provider.get())) {
                throw new GradleException('the ' + name + " run's game directory must not stage the cloudlibuitest harness mod, found: " + provider.get())
            }
        }
        logger.lifecycle('run isolation verified: harnessRuns=[{}] plainRunMods=[{}] plainRunDirs=[{}] unitTest=[{}]',
                harnessRuns.keySet().collect { it + '=' + harnessRunMods[it].get() }.join(' '),
                plainRunMods.collect { it.key + '=' + it.value.get() }.join(' '),
                plainRunDirs.collect { it.key + '=' + it.value.get() }.join(' '),
                unitTestLoadedMods.get())
    }
}

// jar 纯净性：生产 jar 不得包含 uitest 场景类。
def productionJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
tasks.register('verifyJarPurity') {
    group = 'verification'
    description = 'Fails when the production jar carries dev-only UI-test scenario classes.'
    inputs.files(productionJar)
    doLast {
        def forbiddenPrefix = 'dev/vfyjxf/cirrus/uitest/'
        def offenders = []
        def jarFile = productionJar.get().asFile
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().each { entry ->
                if (entry.name.endsWith('.class') && entry.name.startsWith(forbiddenPrefix)) {
                    offenders.add(entry.name)
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException('the production jar carries UI-test scenario classes: ' + offenders)
        }
        logger.lifecycle('jar purity verified: no harness scenario classes in {}', jarFile.name)
    }
}
tasks.named('check') {
    dependsOn 'verifyRunIsolation', 'verifyJarPurity'
}

