// The in-client UI test harness, consumed from CloudLib.
//
// Applied from Mod/build.gradle AFTER the neoForge { runs { } } block:
//     apply from: rootProject.file('gradle/cloudlib-uitest.gradle')
// The script registers the clientTests run and stages the published harness mod into that run's
// game directory, so it has to run after the runs block it extends.
//
// The harness is a MOD of its own - cloudlibuitest - and not a classpath library: FML discovers it,
// applies its mixins and scans its annotations only when it is loaded like any other mod. That mod
// is CloudLib's, not one of CalculatorCirrus's source sets, so it arrives the one way that works
// without a `mods { }` entry here: the published artifact (dev.vfyjxf.cloudlib:cloudlib-uitest) is
// copied into the run's own game-directory mods/ folder, which FML's ModsFolderLocator scans in dev
// exactly as it does in production. Nothing puts it on a classpath, so no run that does not ask for
// it can load it.
//
// CalculatorCirrus's scenarios live in src/uitest (the calculatorcirrusuitest mod), which the
// scenario registry finds by annotation scan across every loaded mod. That mod is a declared mod of
// the clientTests run, so its classes are in the run's mod folders; the harness mod contributes the
// engine and the runners.
//
// The properties travel to the client as system properties, not program arguments, because
// Minecraft's own argument parser rejects arguments it does not know.

// The output directory is captured as a local: inside a run or task closure the script's own
// properties are not the closure's delegate, so a script-level name would not resolve there.
def clUiTestOutDir = layout.buildDirectory.dir('cloudlib-uitest')
def clUiTestOut = clUiTestOutDir.get().asFile.absolutePath
def clUiTestSelection = project.findProperty('clTest')?.toString()
def clUiTestExclude = project.findProperty('clTestExclude')?.toString() ?: ''
def clUiTestGuiScale = project.findProperty('clTestGuiScale')?.toString()
def clUiTestWindow = project.findProperty('clTestWindow')?.toString()
def clUiTestInputMode = project.findProperty('clTestInputMode')?.toString()
def clUiTestWatchdogSec = project.findProperty('clTestWatchdogSec')?.toString()
def clUiTestKeepOpen = project.hasProperty('clTestKeepOpen')
def clUiTestUpdateGolden = project.hasProperty('clTestUpdateGolden')
def clUiTestThemes = project.findProperty('clThemes')?.toString()
// Headless is the default so a visual run never steals the device window; -PclTestWindowed restores it.
def clUiTestWindowed = project.hasProperty('clTestWindowed')
def clUiTestHeadless = project.ext.cloudlibUiTestHeadlessByDefault ? !clUiTestWindowed : project.hasProperty('clTestHeadless')

// The real input driver warps the OS cursor, which needs a visible, focused window. Rejected at
// configuration time rather than quietly downgraded to the synthetic driver.
if (clUiTestHeadless && clUiTestInputMode != null && clUiTestInputMode.equalsIgnoreCase('REAL')) {
    throw new GradleException(
        'clientTests is headless by default and cannot be combined with -PclTestInputMode=REAL: '
            + 'the real input driver moves the OS cursor and needs a visible, focused window. '
            + 'Use -PclTestWindowed only for a manual windowed run.'
    )
}

// The window size is given as WxH; anything else is ignored rather than guessed at.
def clUiTestWindowWidth = null
def clUiTestWindowHeight = null
if (clUiTestWindow != null) {
    def parts = clUiTestWindow.toLowerCase().split('x')
    if (parts.length == 2) {
        clUiTestWindowWidth = parts[0].trim()
        clUiTestWindowHeight = parts[1].trim()
    }
}

// A headless run forces earlyWindowControl=false and restores the user's fml.toml afterwards.
def clUiTestFmlDir = layout.buildDirectory.dir('cloudlib-uitest-fml').get().asFile
def clUiTestFmlTarget = file('runs/client-tests/config/fml.toml')
def clUiTestFmlBackup = new File(clUiTestFmlDir, 'fml.toml.backup')
def clUiTestFmlAbsent = new File(clUiTestFmlDir, 'fml.toml.absent')

def clRestoreUiTestFml = {
    if (clUiTestFmlBackup.isFile()) {
        clUiTestFmlTarget.parentFile.mkdirs()
        java.nio.file.Files.copy(
            clUiTestFmlBackup.toPath(),
            clUiTestFmlTarget.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
        clUiTestFmlBackup.delete()
        clUiTestFmlAbsent.delete()
    } else if (clUiTestFmlAbsent.isFile()) {
        clUiTestFmlTarget.delete()
        clUiTestFmlAbsent.delete()
    }
}

def clRecoverUiTestFml = {
    clRestoreUiTestFml()
}

def clSeedUiTestFml = {
    clUiTestFmlDir.mkdirs()
    clUiTestFmlBackup.delete()
    clUiTestFmlAbsent.delete()
    if (clUiTestFmlTarget.isFile()) {
        java.nio.file.Files.copy(
            clUiTestFmlTarget.toPath(),
            clUiTestFmlBackup.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
    } else {
        clUiTestFmlAbsent.createNewFile()
    }
    def text = clUiTestFmlTarget.isFile()
        ? clUiTestFmlTarget.getText('UTF-8')
        : 'earlyWindowControl = false\n'
    def seeded = text.replaceAll(/(?m)^earlyWindowControl\s*=.*$/, 'earlyWindowControl = false')
    if (!seeded.contains('earlyWindowControl')) {
        seeded = seeded + (seeded.endsWith('\n') ? '' : '\n') + 'earlyWindowControl = false\n'
    }
    clUiTestFmlTarget.parentFile.mkdirs()
    clUiTestFmlTarget.setText(seeded, 'UTF-8')
}

// The harness mod artifact. This configuration is resolved only for the copy task below, so the
// harness jar never reaches any run's classpath - which is the point: a classpath mod would load in
// every run, and the isolation gate could not see it because it is not a mods { } entry.
configurations {
    cloudlibUiTestMod {
        canBeConsumed = false
        canBeResolved = true
        description = 'The published dev-only cloudlibuitest harness mod, staged into harness runs.'
    }
}

dependencies {
    cloudlibUiTestMod "dev.vfyjxf.cloudlib:cloudlib-uitest:${project.cloudlib_version}"
}

// Places exactly one harness jar in a harness run's game-directory mods/ folder. A stale jar from
// an earlier version would surface as a duplicate mod rather than as an upgrade, so the task clears
// the harness jars it owns before copying - and only those.
def clStageUiTestMod = { String taskName, String runDirName ->
    def jarSet = configurations.cloudlibUiTestMod
    def modsDir = layout.projectDirectory.dir(runDirName + '/mods')
    def stage = tasks.register(taskName) {
        group = 'verification'
        description = "Stages the cloudlibuitest harness mod into ${runDirName}/mods."
        def jars = jarSet
        def target = modsDir
        inputs.files(jars).withPropertyName('harnessMod')
        outputs.dir(target).withPropertyName('modsDir')
        doLast {
            def dir = target.asFile
            dir.mkdirs()
            def existing = dir.listFiles()
            if (existing != null) {
                existing.findAll { it.isFile() && it.name ==~ /cloudlib-uitest-.*\.jar/ }.each { it.delete() }
            }
            jars.files.each { jarFile ->
                java.nio.file.Files.copy(
                    jarFile.toPath(),
                    new File(dir, jarFile.name).toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
            logger.lifecycle('cloudlib-uitest harness mod staged in {} ({})', dir, jars.files*.name.join(', '))
        }
    }
    return stage
}

// The mods the harness run loads beside the harness itself: the engine and the UI-test composition
// the scenarios live in. Declared explicitly because a run created from a separate script would
// otherwise inherit every declared mod.
def clCirrusMod = neoForge.mods.getByName(project.mod_id.toString())
def clCirrusUiTestMod = neoForge.mods.getByName('calculatorcirrusuitest')

// The harness's one run, and the only one that loads cloudlibuitest. Its own game directory keeps a
// harness boot from ever sharing a latest.log or a world with an ordinary client, and the -PclTest*
// wiring lives here rather than on the plain client run, which is harness-free by construction.
// A run created from a separate script cannot borrow a type from its name, so the type is explicit.
neoForge.runs {
    clientTests {
        client()
        gameDirectory = project.file('runs/client-tests')
        loadedMods.add(clCirrusMod)
        loadedMods.add(clCirrusUiTestMod)
        if (clUiTestSelection != null) {
            systemProperty 'cloudlib.uitest.run', clUiTestSelection
            systemProperty 'cloudlib.uitest.out', clUiTestOut
            systemProperty 'cloudlib.uitest.exclude', clUiTestExclude
            if (clUiTestGuiScale != null) systemProperty 'cloudlib.uitest.guiScale', clUiTestGuiScale
            if (clUiTestWindowWidth != null) systemProperty 'cloudlib.uitest.windowWidth', clUiTestWindowWidth
            if (clUiTestWindowHeight != null) systemProperty 'cloudlib.uitest.windowHeight', clUiTestWindowHeight
            if (clUiTestInputMode != null) systemProperty 'cloudlib.uitest.inputMode', clUiTestInputMode
            if (clUiTestWatchdogSec != null) systemProperty 'cloudlib.uitest.watchdogSec', clUiTestWatchdogSec
            if (clUiTestKeepOpen) systemProperty 'cloudlib.uitest.keepOpen', 'true'
            if (clUiTestUpdateGolden) systemProperty 'cloudlib.uitest.updateGolden', 'true'
            if (clUiTestThemes != null) systemProperty 'cloudlib.uitest.themes', clUiTestThemes
        }
        if (clUiTestHeadless) systemProperty 'cloudlib.uitest.headless', 'true'
    }
}

def clStageClientTestsMod = clStageUiTestMod('stageClientTestsUiTestMod', 'runs/client-tests')

// The script hands its wiring to the build's verifyRunIsolation, which cannot read the task graph
// under the configuration cache: run-directory -> staging task, for every harness run there is.
project.ext.cloudlibUiTestStagedDirs = [
        'runs/client-tests': 'stageClientTestsUiTestMod'
]

tasks.named('check') {
    dependsOn tasks.named('compileUitestJava')
}

// Deletes the previous run so the verification task can never read an older verdict. A real task
// dependency, not a doFirst: Gradle snapshots a task's inputs before running its actions, so a
// doFirst is never reached when the runtime classpath fails to resolve - exactly the case the
// delete exists for.
def clUiTestCleanReport = tasks.register('cloudlibCleanUiTestReport', Delete) {
    group = 'verification'
    description = 'Deletes the previous cloudlib UI test run output.'
    delete clUiTestOutDir
}

def clUiTestVerify = tasks.register('verifyUiTest') {
    group = 'verification'
    description = 'Reads the UI test report and fails the build unless every selected scenario passed.'
    onlyIf { clUiTestSelection != null }
    doLast {
        def report = new File(clUiTestOut, 'report.json')
        if (!report.isFile()) {
            throw new GradleException(
                "no UI test report at ${report} - the client crashed, never reached the runner, "
                    + 'or -PclTest matched no scenarios'
            )
        }
        def run = new groovy.json.JsonSlurper().parse(report)
        def totals = run.totals
        logger.lifecycle(
            "cloudlib-uitest ${run.status}: ${totals.passed}/${totals.scenarios} scenarios passed, "
                + "${totals.checks - totals.checksFailed}/${totals.checks} checks passed, "
                + "${totals.captures} captures, ${run.durationMs} ms"
        )
        def failures = []
        run.scenarios.each { scenario ->
            if (scenario.status != 'PASS') {
                failures.add("scenario ${scenario.name}: ${scenario.status}"
                    + (scenario.message == null ? '' : " (${scenario.message})"))
            }
            scenario.steps.each { step ->
                if (step.status != 'PASS') {
                    logger.error("  step ${step.index} ${step.name}: ${step.status}"
                        + (step.waitingFor == null ? '' : " waitingFor=${step.waitingFor}"))
                    step.checks.each { check ->
                        if (!check.passed) {
                            logger.error("    check ${check.label} FAILED"
                                + (check.detail == null ? '' : " (${check.detail})"))
                        }
                    }
                    step.captures.each { capture ->
                        logger.error("    capture ${capture.path}"
                            + (capture.suspect ? ' SUSPECT flat colour' : ''))
                    }
                    if (step.error != null) {
                        logger.error("    error ${step.error.type}: ${step.error.message}")
                    }
                }
            }
        }
        if (!failures.isEmpty()) {
            throw new GradleException('UI test failed:\n  ' + failures.join('\n  '))
        }
    }
}

// The run tasks are created after this script is evaluated, so the hook is a configureEach rather
// than a direct reference. A missing report is itself a failure, which is what makes a client that
// crashed before the runner started show up as a red build.
tasks.configureEach { task ->
    if (task.name != 'runClientTests' || clUiTestSelection == null) return
    task.dependsOn clUiTestCleanReport
    task.finalizedBy clUiTestVerify
}

def clUiTestRestoreFml = tasks.register('cloudlibRestoreUiTestFml') {
    group = 'verification'
    description = 'Restores runs/client-tests/config/fml.toml after a headless clientTests run.'
    doLast {
        clRestoreUiTestFml()
    }
}

// Staging the harness mod is what makes the run possible, and without -PclTest the run is inert:
// it boots a client that loads the harness mod and runs nothing. Calling that out is friendlier
// than letting it look like a hang.
tasks.matching { it.name == 'runClientTests' }.configureEach { task ->
    task.dependsOn clStageClientTestsMod
    task.finalizedBy clUiTestRestoreFml
    task.doFirst {
        // Recover a backup left behind by an interrupted earlier run before taking a fresh one.
        clRecoverUiTestFml()
        if (clUiTestHeadless) {
            clSeedUiTestFml()
        }
        if (clUiTestSelection == null) {
            logger.lifecycle(
                'runClientTests without -PclTest: the client boots with the harness mod loaded and runs no scenario'
            )
        }
    }
}
