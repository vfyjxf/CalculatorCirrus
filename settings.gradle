pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

include(":Mod")
//include(':Integration')
includeBuild("../CloudLib-Standalone") {
    dependencySubstitution {
        substitute module('dev.vfyjxf:cloudlib') using project(':')
    }
}
