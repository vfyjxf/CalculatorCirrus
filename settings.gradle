pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
    // style/pmd 插件由该构建提供。
    includeBuild('../CloudLib-Standalone/cloudlang-plugin')
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

include(":Mod")
//include(':Integration')
includeBuild('../CloudLib-Standalone') {
    dependencySubstitution {
        substitute module('dev.vfyjxf.cloudlib:cloudlib') using project(':')
    }
}
// 复合替换只对顶层 includeBuild 生效，插件解析那次不替换依赖。
includeBuild('../CloudLib-Standalone/cloudlang-plugin') {
    dependencySubstitution {
        // 只补测试源集的 Error Prone 检查 jar；插件解析与 cloudlib 坐标保持不变。
        substitute module('dev.vfyjxf:cloudtestplugin') using project(':cloudtestplugin')
    }
}
